id: generic.bridge
version: 1.0.0
title: 可审计桥梁通用验算示例规则包
authority: BridgeMind research implementation
normative: false
rules:
  - id: GENERIC-SLS-DISP-001
    title: 最大位移限值
    clause: project-defined acceptance criterion
    applicability: "results.maxDisplacement is not None and acceptance.allowableDisplacement is not None"
    demand: "abs(results.maxDisplacement)"
    capacity: "acceptance.allowableDisplacement"
    unit: m
    warningUtilization: 0.85
    requiredInputs:
      - results.maxDisplacement
      - acceptance.allowableDisplacement
  - id: GENERIC-ULS-STRESS-001
    title: 最大等效应力限值
    clause: project-defined design resistance
    applicability: "results.maxStress is not None and acceptance.designStrength is not None"
    demand: "abs(results.maxStress)"
    capacity: "acceptance.designStrength"
    unit: Pa
    warningUtilization: 0.9
    requiredInputs:
      - results.maxStress
      - acceptance.designStrength
  - id: GENERIC-EQUILIBRIUM-001
    title: 反力平衡残差
    clause: numerical verification
    applicability: "results.reactionBalanceResidual is not None and acceptance.maxReactionBalanceResidual is not None"
    demand: "abs(results.reactionBalanceResidual)"
    capacity: "acceptance.maxReactionBalanceResidual"
    unit: ratio
    warningUtilization: 0.8
    requiredInputs:
      - results.reactionBalanceResidual
      - acceptance.maxReactionBalanceResidual
