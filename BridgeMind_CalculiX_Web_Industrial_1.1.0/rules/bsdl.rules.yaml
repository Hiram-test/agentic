rules:
  - id: BSDL-ID-001
    severity: critical
    title: 所有实体 ID 必须全局唯一
    layer: reference
  - id: BSDL-REF-001
    severity: critical
    title: 所有核心引用必须指向存在实体
    layer: reference
  - id: BSDL-CS-001
    severity: critical
    title: 坐标系轴必须非零、正交且满足右手规则
    layer: geometry
  - id: BSDL-NODE-001
    severity: error
    title: 节点坐标必须为有限数
    layer: geometry
  - id: BSDL-COMP-001
    severity: critical
    title: 线构件必须恰有两个不同节点
    layer: topology
  - id: BSDL-COMP-002
    severity: critical
    title: 活跃 frame3d 构件必须引用材料和截面
    layer: mechanics
  - id: BSDL-COMP-003
    severity: critical
    title: 构件长度必须大于数值容差
    layer: topology
  - id: BSDL-CONN-001
    severity: error
    title: 连接至少需要一个参与对象
    layer: topology
  - id: BSDL-LOAD-001
    severity: critical
    title: 节点荷载必须引用有效节点和荷载工况
    layer: mechanics
  - id: BSDL-TASK-001
    severity: error
    title: 分析任务引用的荷载工况必须存在
    layer: task
  - id: BSDL-REG-001
    severity: error
    title: 活跃区域必须具有正尺寸和正 targetSize
    layer: meshing
  - id: BSDL-MESH-001
    severity: error
    title: MeshPolicy 中的区域必须存在
    layer: meshing
  - id: BSDL-SOLVE-001
    severity: critical
    title: 求解前模型必须至少有一个约束自由度和一个荷载
    layer: execution
  - id: BSDL-SOLVE-002
    severity: critical
    title: 刚度矩阵不得存在未处理刚体模态
    layer: execution
  - id: BSDL-AUDIT-001
    severity: warning
    title: 人工修改和 FEA 反馈应形成 Feedback 记录
    layer: audit
