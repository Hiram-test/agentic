skills:
  - id: skill.global_allocator
    name: 全局资源分配
    inputs: [components, nodes, analysisTasks, budget]
    outputs: [baseSize, scaleMetrics]
    deterministic: true
  - id: skill.support_joint
    name: 支承与节点识别
    inputs: [nodeDegree, constraints, componentCategories]
    outputs: [RegionProposal]
    deterministic: true
  - id: skill.discontinuity
    name: 几何与属性突变识别
    inputs: [memberAngles, sectionRatios, materialChanges]
    outputs: [RegionProposal]
    deterministic: true
  - id: skill.smooth_region
    name: 平滑连续区识别
    inputs: [memberLength, continuity, curvatureProxy]
    outputs: [RegionProposal]
    deterministic: true
  - id: skill.fea_hotspot
    name: FEA 热点反馈
    inputs: [nodeDisplacements, elementEndForces, responseGradients]
    outputs: [RegionProposal, Feedback]
    deterministic: true
  - id: skill.human_override
    name: 人工覆盖
    inputs: [humanRegions, editLog]
    outputs: [RegionProposal]
    deterministic: true
