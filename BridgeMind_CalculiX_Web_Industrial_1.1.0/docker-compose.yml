# 定义可直接部署的单节点 BridgeMind 网站栈。
services:
  # 运行 BSDL、CalculiX Adapter、项目版本库和 PWA API。
  app:
    # 从当前交付包构建应用镜像。
    build:
      # 使用项目根目录作为构建上下文。
      context: .
      # 使用经过测试的生产 Dockerfile。
      dockerfile: Dockerfile
    # 为日志和运维设置稳定容器名称。
    container_name: bridgemind-app
    # 在异常退出后自动恢复服务。
    restart: unless-stopped
    # 声明应用运行所需环境变量并允许 .env 或命令行覆盖。
    environment:
      # 把数据库保存在持久化卷中。
      BRIDGEMIND_DATABASE_PATH: /app/data/bridgemind.sqlite3
      # 把求解输入、日志和结果保存在持久化卷中。
      BRIDGEMIND_RUNS_PATH: /app/runs
      # 指向只读挂载的 CalculiX 2.23 可执行文件。
      CCX_EXECUTABLE: /opt/calculix/ccx
      # 读取可选的逗号分隔 API 密钥。
      BRIDGEMIND_API_KEYS: ${BRIDGEMIND_API_KEYS:-}
      # 读取可选的 OpenMP 线程限制。
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      # 读取可选的结果处理线程限制。
      CCX_NPROC_RESULTS: ${CCX_NPROC_RESULTS:-4}
    # 挂载数据库、作业产物和外部求解器。
    volumes:
      # 持久化项目数据库。
      - bridgemind-data:/app/data
      # 持久化 CalculiX 输入与结果。
      - bridgemind-runs:/app/runs
      # 把管理员提供的 ccx 文件只读挂载到容器中。
      - ./solver:/opt/calculix:ro
    # 限制进程和内存以避免单作业拖垮主机。
    pids_limit: 1024
    # 提供合理的共享内存空间。
    shm_size: 1gb
    # 仅向内部反向代理暴露应用端口。
    expose:
      # 暴露 FastAPI 内部端口。
      - "8000"
    # 使用服务健康状态控制反向代理启动。
    healthcheck:
      # 调用公开健康端点。
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/api/health"]
      # 每三十秒执行一次探活。
      interval: 30s
      # 单次探活最多等待五秒。
      timeout: 5s
      # 连续三次失败后标记不健康。
      retries: 3
      # 为首次数据库初始化预留启动时间。
      start_period: 15s
  # 提供公网入口、上传限制和长作业代理超时。
  nginx:
    # 使用官方轻量 Nginx 镜像。
    image: nginx:1.27-alpine
    # 为日志和运维设置稳定容器名称。
    container_name: bridgemind-nginx
    # 在异常退出后自动恢复服务。
    restart: unless-stopped
    # 等待应用健康后再启动代理。
    depends_on:
      app:
        # 要求 FastAPI 健康检查通过。
        condition: service_healthy
    # 把网站 HTTP 端口映射到主机。
    ports:
      # 默认通过主机八十端口访问。
      - "${BRIDGEMIND_HTTP_PORT:-80}:80"
    # 只读挂载反向代理配置。
    volumes:
      # 使用交付包中的生产代理配置。
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
# 声明数据库和求解产物持久化卷。
volumes:
  # 保存 SQLite 数据库。
  bridgemind-data:
  # 保存 CalculiX 作业目录。
  bridgemind-runs:
