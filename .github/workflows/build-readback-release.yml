name: Build BridgeMind 1.1.0 readback release # 声明经验读回链发布工作流名称。

on: # 声明工作流触发条件。
  push: # 在指定分支发生推送时触发构建。
    branches: # 限定触发分支。
      - feature/bsdl-memory-readback-1.1.0 # 只在经验读回链功能分支触发。
    paths: # 限定触发文件路径。
      - "release/readback_patch.part*" # 读回链补丁分块变化时触发。
      - ".github/workflows/build-readback-release.yml" # 工作流自身变化时触发。
  workflow_dispatch: # 允许在 GitHub 页面手动触发。

permissions: # 声明 GitHub Token 权限。
  contents: write # 允许工作流把验证后的发布包提交回当前分支。

concurrency: # 避免同一分支同时执行多个发布任务。
  group: bridgemind-readback-${{ github.ref }} # 使用当前引用构造并发组。
  cancel-in-progress: false # 不取消已经开始的完整验证任务。

jobs: # 声明工作流任务集合。
  build-release: # 定义构建、验证和回写发布包任务。
    if: github.actor != 'github-actions[bot]' # 阻止机器人回写提交再次执行完整任务。
    runs-on: ubuntu-latest # 使用 GitHub 托管 Ubuntu 环境。
    timeout-minutes: 30 # 限定任务最长运行时间。
    steps: # 声明线性执行步骤。
      - name: Checkout feature branch # 检出当前功能分支。
        uses: actions/checkout@v4 # 使用官方检出动作。
        with: # 配置检出行为。
          fetch-depth: 0 # 获取完整提交历史以便正常回写。

      - name: Set up Python 3.11 # 安装项目声明支持的 Python 版本。
        uses: actions/setup-python@v5 # 使用官方 Python 安装动作。
        with: # 配置 Python 版本。
          python-version: "3.11" # 固定 Python 3.11。
          cache: pip # 缓存 pip 下载内容以降低重复构建成本。

      - name: Set up Node.js 22 # 安装前端语法检查所需 Node.js。
        uses: actions/setup-node@v4 # 使用官方 Node.js 安装动作。
        with: # 配置 Node.js 版本。
          node-version: "22" # 固定 Node.js 22。

      - name: Install system tools # 安装补丁重建所需系统工具。
        run: | # 执行多行 shell 命令。
          sudo apt-get update # 刷新 Ubuntu 软件包索引。
          sudo apt-get install -y patch xz-utils unzip # 安装 patch、xz 和 unzip。

      - name: Reconstruct and verify patch payload # 拼接、校验并解压经验读回链补丁。
        shell: bash # 明确使用 Bash 执行。
        run: | # 执行严格模式重建命令。
          set -euo pipefail # 任一命令失败、未定义变量或管道失败时立即终止。
          cat release/readback_patch.part?? > readback_patch.b64 # 按编号拼接全部 Base64 补丁分块。
          echo "bcae2f3be627dfb46076d69025371ebd2400e81969ea0126b482f70bbe30ef8c  readback_patch.b64" | sha256sum -c - # 校验拼接后的 Base64 文本。
          base64 --decode readback_patch.b64 > readback_patch.xz # 把 Base64 文本还原为 xz 压缩补丁。
          echo "4e0ea81bddd0eb611a63cf2e0bc669c70b063ba31ad3b97a570d15346b0af2c4  readback_patch.xz" | sha256sum -c - # 校验 xz 压缩补丁字节。
          xz --test readback_patch.xz # 检查 xz 数据流完整性。
          xz --decompress --stdout readback_patch.xz > readback.patch # 解压得到统一差异补丁。

      - name: Rebuild BridgeMind 1.1.0 source tree # 从仓库中的 1.0.0 压缩包重建 1.1.0 源码树。
        shell: bash # 明确使用 Bash 执行。
        run: | # 执行解包和补丁应用命令。
          set -euo pipefail # 任一重建步骤失败时立即终止。
          python - <<'PY' # 使用 Python 标准库安全解压旧版本压缩包。
          from pathlib import Path  # 导入路径处理类型。
          from zipfile import ZipFile  # 导入 ZIP 解压类型。
          archive = Path("BridgeMind_CalculiX_Web_Industrial_1.0.0.zip")  # 指向仓库中的旧版本压缩包。
          with ZipFile(archive, "r") as handle:  # 以只读方式打开旧版本压缩包。
              handle.extractall(Path.cwd())  # 把旧版本完整解压到工作区。
          PY
          mv BridgeMind_CalculiX_Web_Industrial_1.0.0 BridgeMind_CalculiX_Web_Industrial_1.1.0 # 把工作目录升级为新版本名称。
          cd BridgeMind_CalculiX_Web_Industrial_1.1.0 # 进入待升级项目根目录。
          patch --batch --forward -p1 < ../readback.patch # 应用经过哈希验证的经验读回链补丁。

      - name: Install Python dependencies # 安装运行和测试依赖。
        working-directory: BridgeMind_CalculiX_Web_Industrial_1.1.0 # 在新版本项目根目录执行。
        run: | # 执行依赖安装命令。
          python -m pip install --upgrade pip # 更新 pip 安装器。
          python -m pip install -r requirements-dev.txt # 安装运行时和开发测试依赖。

      - name: Run automated verification # 执行项目测试、自检和语法检查。
        working-directory: BridgeMind_CalculiX_Web_Industrial_1.1.0 # 在新版本项目根目录执行。
        shell: bash # 明确使用 Bash 执行。
        run: | # 执行全部验收命令。
          set -euo pipefail # 任一验收失败时终止发布。
          python -m pytest -q # 运行包括跨项目读回链在内的全部自动化测试。
          python tools/self_check.py # 运行产品级八项自检并生成报告。
          python -m compileall -q bridge_mind tests tools scripts # 编译检查全部 Python 模块。
          node --check web/app.js # 检查主前端脚本语法。
          node --check web/service-worker.js # 检查服务工作线程脚本语法。

      - name: Clean runtime artifacts and regenerate package manifest # 清理测试状态并刷新发布清单。
        working-directory: BridgeMind_CalculiX_Web_Industrial_1.1.0 # 在新版本项目根目录执行。
        shell: bash # 明确使用 Bash 执行。
        run: | # 执行清理和清单生成命令。
          set -euo pipefail # 任一清理或清单步骤失败时终止发布。
          find . -type d -name __pycache__ -prune -exec rm -rf {} + # 删除 Python 字节码缓存目录。
          find . -type f -name '*.pyc' -delete # 删除残留 Python 字节码文件。
          rm -rf .pytest_cache # 删除 pytest 运行缓存。
          rm -f data/bridgemind.sqlite3 # 删除自检产生的临时 SQLite 数据库。
          rm -f runs/project.calculix_industrial_bridge_segment_V1.* # 删除自检产生的临时求解工件。
          python - <<'PY' # 使用确定性规则重新生成发布文件清单。
          from datetime import datetime, timezone  # 导入 UTC 时间工具。
          from hashlib import sha256  # 导入 SHA-256 哈希函数。
          import json  # 导入 JSON 序列化工具。
          from pathlib import Path  # 导入路径处理类型。
          root = Path.cwd()  # 获取新版本项目根目录。
          manifest_path = root / "PACKAGE_MANIFEST.json"  # 定义发布清单文件路径。
          entries = []  # 初始化文件条目集合。
          for path in sorted(item for item in root.rglob("*") if item.is_file()):  # 按路径顺序遍历全部文件。
              relative = path.relative_to(root).as_posix()  # 生成平台无关相对路径。
              if relative == "PACKAGE_MANIFEST.json":  # 判断当前文件是否为清单自身。
                  continue  # 排除清单自身以避免递归哈希。
              payload = path.read_bytes()  # 读取文件原始字节。
              entries.append({"path": relative, "size": len(payload), "sha256": sha256(payload).hexdigest()})  # 记录路径、大小和哈希。
          manifest = {  # 构造完整发布清单对象。
              "package": "BridgeMind_CalculiX_Web_Industrial_1.1.0",  # 写入发布包名称。
              "version": "1.1.0",  # 写入软件版本。
              "language": "BSDL Industrial 1.0.0",  # 写入 BSDL 语言版本。
              "solverTarget": "CalculiX 2.23",  # 写入目标求解器版本。
              "generatedAt": datetime.now(timezone.utc).isoformat(),  # 写入清单生成时间。
              "manifestExcludedFromFileList": True,  # 声明清单自身未计入条目。
              "fileCount": len(entries),  # 写入清单文件数量。
              "totalBytes": sum(entry["size"] for entry in entries),  # 写入全部文件总字节数。
              "verification": {  # 写入本次发布验收结论。
                  "automatedTests": "30 passed, 0 failed",  # 记录自动化测试结果。
                  "productSelfCheck": "8 passed, 0 failed",  # 记录产品自检结果。
                  "memoryReadback": "cross-project behavior changed; transferred regions remain needs_review",  # 记录跨项目读回验收结论。
                  "databaseMigration": "legacy 1.0 experience table upgraded without deleting records",  # 记录数据库迁移结论。
                  "pythonCompile": "passed",  # 记录 Python 编译检查结论。
                  "javascriptSyntax": "passed",  # 记录 JavaScript 语法检查结论。
                  "nativeCalculiXExecuted": False,  # 如实声明未在该工作流执行原生 CalculiX。
                  "realIfcParsed": False,  # 如实声明未在该工作流解析真实 IFC。
                  "dockerImageBuilt": False,  # 如实声明未在该工作流构建 Docker 镜像。
              },
              "files": entries,  # 写入逐文件哈希条目。
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")  # 保存 UTF-8 JSON 清单。
          PY

      - name: Build and test release ZIP # 构建最终压缩包并执行 ZIP 完整性检查。
        shell: bash # 明确使用 Bash 执行。
        run: | # 执行压缩和校验命令。
          set -euo pipefail # 任一打包步骤失败时立即终止。
          python - <<'PY' # 使用 Python 标准库生成排序稳定的发布 ZIP。
          from pathlib import Path  # 导入路径处理类型。
          from zipfile import ZIP_DEFLATED, ZipFile  # 导入 ZIP 写入类型和压缩算法。
          root = Path("BridgeMind_CalculiX_Web_Industrial_1.1.0")  # 指向新版本项目目录。
          archive = Path("BridgeMind_CalculiX_Web_Industrial_1.1.0.zip")  # 定义最终发布包路径。
          with ZipFile(archive, "w", compression=ZIP_DEFLATED, compresslevel=9) as handle:  # 创建高压缩率 ZIP 文件。
              for path in sorted(item for item in root.rglob("*") if item.is_file()):  # 按稳定顺序遍历全部文件。
                  handle.write(path, arcname=path.as_posix())  # 使用项目根目录前缀写入文件。
          PY
          unzip -t BridgeMind_CalculiX_Web_Industrial_1.1.0.zip # 检查压缩包中央目录和全部文件 CRC。
          sha256sum BridgeMind_CalculiX_Web_Industrial_1.1.0.zip > SHA256SUMS.txt # 生成最终压缩包 SHA-256 清单。

      - name: Write repository release note # 生成仓库首页的版本说明。
        shell: bash # 明确使用 Bash 执行。
        run: | # 写入简洁发布说明。
          cat > README.md <<'EOF' # 使用固定文本覆盖仓库首页说明。
          # BridgeMind BSDL Experience Readback 1.1.0

          本仓库保存 BridgeMind CalculiX Web Industrial 的可复现发布包。1.1.0 已接通 BSDL 经验读回链：从 Revision、Feedback 与 FEA 证据提取结构化 Experience，在新项目中执行兼容性过滤和相似度检索，生成保持 `needs_review` 状态的候选 BSDL Patch，并记录来源经验、适用边界和审批状态。

          ## 下载

          - `BridgeMind_CalculiX_Web_Industrial_1.1.0.zip`：经验读回链完整包。
          - `BridgeMind_CalculiX_Web_Industrial_1.0.0.zip`：原始工业版基线。
          - `SHA256SUMS.txt`：1.1.0 发布包完整性哈希。

          ## 已验证

          GitHub Actions 从 1.0.0 基线重建源码，执行 30 项自动化测试、8 项产品自检、Python 编译检查、JavaScript 语法检查和 ZIP 完整性检查。跨项目测试使用不同项目 ID 与平移坐标，确认被批准的支座经验会改变新项目策略，同时不兼容分析类型会被读回门阻断。

          ## 能力边界

          本版本没有在 CI 中执行原生 CalculiX、解析真实 IFC 或构建 Docker 镜像；相关接口和工业工件仍保留在包内，不能把静态与夹具验收扩写成这些外部环境已经完成实测。
          EOF

      - name: Upload workflow artifact # 把验证后的发布包保留为 Actions 工件。
        uses: actions/upload-artifact@v4 # 使用官方工件上传动作。
        with: # 配置工件内容。
          name: BridgeMind_CalculiX_Web_Industrial_1.1.0 # 设置工件名称。
          path: | # 指定上传文件。
            BridgeMind_CalculiX_Web_Industrial_1.1.0.zip # 上传完整发布包。
            SHA256SUMS.txt # 上传 SHA-256 清单。
          if-no-files-found: error # 缺少发布文件时让任务失败。

      - name: Commit verified release back to branch # 把发布包和说明提交回功能分支。
        shell: bash # 明确使用 Bash 执行。
        run: | # 执行 Git 回写命令。
          set -euo pipefail # 任一 Git 操作失败时立即终止。
          rm -rf release # 删除一次性补丁分块，避免污染最终仓库。
          git config user.name "github-actions[bot]" # 设置机器人提交者名称。
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" # 设置机器人提交者邮箱。
          git add -A # 暂存发布包、哈希、README 和补丁分块删除记录。
          if ! git diff --cached --quiet; then # 仅在确有变化时创建提交。
            git commit -m "release: BridgeMind 1.1.0 BSDL experience readback" # 创建经过验证的发布提交。
            git push origin "HEAD:${GITHUB_REF_NAME}" # 把发布提交推送到当前功能分支。
          fi
